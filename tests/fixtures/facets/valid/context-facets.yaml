    value-schema: {type: boolean}
  - id: index.valid
    value-schema: {type: boolean}
  - id: sample.array
    value-schema:
      type: array
      items: {type: integer}
  - id: sample.boolean-or-number
    value-schema: {type: [boolean, number]}

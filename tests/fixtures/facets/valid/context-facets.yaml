    value-schema: {type: boolean}
  - id: artifact.created
    value-schema: {type: boolean}
  - id: artifact.written
    value-schema: {type: boolean}
  - id: b
    value-schema: {type: boolean}
  - id: claim.quantitative
    value-schema: {type: boolean}
  - id: context.available
    value-schema: {type: boolean}

schema-version: 1
id: content/refined
kind: rule
owner: registry
status: active
source-revision: fixture-1
applicability: {facet: context.available, operator: exists}
relations:
  - {type: requires, target: content/base}
  - {type: incompatible-with, target: content/alternate}
axis: reasoning-target
failure-mode: visible
norms:
  - id: refine
    modality: must
    subject: agent
    action: {verb: apply, object: the refined contract}
criteria:

    id: content/base
    kind: rule
    owner: registry
    status: active
    source-revision: fixture-1
    applicability: {facet: context.available, operator: exists}
    relations: []
    axis: reasoning-target
    failure-mode: visible
    norms:
      - id: base
        modality: must
        subject: agent
        action: {verb: preserve, object: the base contract}

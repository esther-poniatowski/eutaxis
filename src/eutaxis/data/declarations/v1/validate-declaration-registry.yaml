_schema: eutaxis:declaration@1
id: eutaxis/validate-declaration-registry
kind: procedure
owner: eutaxis
status: active
source-revision: contract-v1
applicability: {facet: context.available, operator: exists}
relations: []
purpose: Establish that a declaration corpus satisfies its static contracts
parameters:
  type: object
  required: [sources, facet-registry]
  properties:
    sources:
      type: array
      minItems: 1
      items: {type: string, minLength: 1}
    facet-registry: {type: string, minLength: 1}
  additionalProperties: false
preconditions: []
actions:
  - id: load-registry
    operation: {id: eutaxis/load-declaration-registry, version: 1}
    with:
      sources: {parameter: sources}
      facet-registry: {parameter: facet-registry}
    on-success: valid-registry
    on-failure: {invalid-registry: invalid-registry}
entry: load-registry
invariants: []
effects: []
postconditions:
  - id: valid-registry
    class: postcondition
    expression: {facet: registry.valid, operator: equals, value: true}
failures: [invalid-registry]

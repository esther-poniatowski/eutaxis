# Generic global agent-instructions config skeleton.
#
# Copy this file into the consumer project (e.g. <project>/config/agents/) and
# fill in the placeholders below with that project's instruction modules and
# output paths. Eutaxis does not ship any consumer-specific data; everything
# project-specific belongs in the consumer's copy.
#
# Wrap as a Jinja template (`.yaml.j2`) only if the consumer also runs a
# machine-inventory rendering pass before invoking `eutaxis generate`.

root: .   # consumer repository root, relative to this config file

common_sources:
  # Instruction modules always loaded for every task. Replace the entries below.
  - path: instructions/global/<module-1>.md
  - path: instructions/global/<module-2>.md

task_modules_intro: |
  Load the matching task module before doing the work. Read the file directly
  from disk; do not paraphrase from memory. Load only the modules that apply to
  the current task.
task_modules:
  # One entry per conditional task module. Replace the example below.
  - id: <module-id>
    title: <Module title>
    path: instructions/tasks/<module-id>.md
    trigger: when <condition under which this module applies>
    description: <one-line summary of what the module covers>

# Optional: enable the auto-generated rule-index review file.
# rule_index_enabled: true
# rule_index_target:
#   path: generated/rule-index.md
#   header: |
#     # Rule index
#   footer: |
#     <!-- Regenerate from the source configuration. -->

agents:
  - name: global-codex
    enabled: true
    max_bytes: 32768   # Codex `project_doc_max_bytes` default
    target:
      path: <absolute path to ~/.codex/AGENTS.md or equivalent>
      header: |
        # Global Agent Instructions
      footer: |
        ---
        Generated by eutaxis. Do not edit this file directly.

  - name: global-claude
    enabled: false   # set true when synchronizing Claude Code globally
    max_bytes: 32768
    target:
      path: <absolute path to ~/.claude/CLAUDE.md or equivalent>
      header: |
        # Global Claude Code Instructions
      footer: |
        ---
        Generated by eutaxis. Do not edit this file directly.
